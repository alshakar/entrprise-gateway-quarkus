# ==============================================================================
# HTTP & Server Core Configurations
# ==============================================================================
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, x-agent-id, x-request-id
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS

# ==============================================================================
# Reactive Oracle Database Client Configuration
# ==============================================================================
quarkus.datasource.db-kind=oracle
quarkus.datasource.username=${ORACLE_DB_USER:gateway_user}
quarkus.datasource.password=${ORACLE_DB_PASSWORD:secret_password}
quarkus.datasource.reactive.url=oracle:thin:@${ORACLE_DB_HOST:localhost}:${ORACLE_DB_PORT:1521}/${ORACLE_DB_SERVICE:ORCLCDB}

# Reactive Pool Configuration
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.min-size=5
quarkus.datasource.reactive.idle-timeout=10m
quarkus.datasource.reactive.connection-timeout=5s
quarkus.datasource.reactive.oracle.ssl=false

# ==============================================================================
# Quarkus CXF (SOAP Integration) Configuration
# ==============================================================================
# Asynchronous HTTP Transport Conduit Selection (Vert.x / HTTP Client 5)
quarkus.cxf.transports.http-hc5.enabled=true

# Dynamic CXF Client Defaults
quarkus.cxf.client.generic-soap-client.connection-timeout=5000
quarkus.cxf.client.generic-soap-client.receive-timeout=15000
quarkus.cxf.client.generic-soap-client.allow-chunking=false

# ==============================================================================
# Quarkus REST Client Reactive Configuration
# ==============================================================================
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1024
quarkus.rest-client.follow-redirects=true

# Connection Pool Settings for Dynamic REST Invocation
quarkus.rest-client.connection-pool-size=50
quarkus.rest-client.connect-timeout=5000
quarkus.rest-client.read-timeout=15000

# ==============================================================================
# Observability & CloudWatch Structured JSON Logging
# ==============================================================================
# Enable Structured JSON Console Logging
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
quarkus.log.console.json.time-zone=UTC

# Additional Metadata Fields for CloudWatch
quarkus.log.console.json.additional-field."service"="enterprise-gateway"
quarkus.log.console.json.additional-field."environment"=${ENVIRONMENT:production}

# Global Log Levels
quarkus.log.level=INFO
quarkus.log.category."com.enterprise.gateway".level=DEBUG
quarkus.log.category."io.quarkus.cxf".level=INFO
quarkus.log.category."io.vertx.oracle".level=INFO

# ==============================================================================
# GraalVM Native Image Compilation
# ==============================================================================
quarkus.native.enable-http-url-handler=true
quarkus.native.resources.includes=WSDL/*.wsdl, schemas/*.xsd
